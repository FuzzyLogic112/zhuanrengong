name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: 校验数据 · 单元测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 校验数据
        run: npm run validate
      - name: 单元测试
        run: npm test
      - name: 构建站点
        run: npm run build
