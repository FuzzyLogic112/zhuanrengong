    channel: phone
    result: success
    by: 凤凰WEEKLY财经（2026 年 3 月实测）
    url: https://finance.sina.com.cn/wm/2026-03-07/doc-inhqcipv5499286.shtml
    summary: 语音说 2 次「人工服务」即可接通；设有老年客户优先通道，老年客户说「帮助」或「人工」即可。
