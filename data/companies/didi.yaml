# 官方客服号码。source = 号码公布出处；checked = 维护者在该出处核对号码的日期（未核对就不写）
hotlines:
  - number: "400-000-0999"
    label: 客服热线

# 目前最可行的转人工步骤，必须能在下面的 reports 里找到依据
steps:
  phone:
    - 按提示选两轮业务类型。
    - 听到短信指引后别挂，菜单最后「返回请按 *」之后按 0。

# 实测记录：媒体或网友亲测，带日期和出处。result: success 转到了 / slow 转到但很费劲 / fail 没转到
reports:
  - date: 2026-09-09
    channel: phone
    result: slow
    by: 新京报（2026 年 9 月 4—6 日实测）
    url: https://news.qq.com/rain/a/20260909A04K8J00
    summary: 要先按提示选两轮业务类型，听到「已发送短信指引」后，人工入口藏在「返回请按 * 号键」之后，按 0 才转人工。

# 覆盖行业默认的投诉渠道
regulators: [mot, samr]
