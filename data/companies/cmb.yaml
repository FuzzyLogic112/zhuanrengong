# 官方客服号码。source = 号码公布出处；checked = 维护者在该出处核对号码的日期（未核对就不写）
hotlines:
  - number: "95555"
    label: 客服热线

# 目前最可行的转人工步骤，必须能在下面的 reports 里找到依据
steps:
  phone:
    - 接通后说「转人工」。
    - 被劝「智能客服可以解决」时，坚持再说一次。
    - 别长时间不说话、不按键：连续几次无操作会被挂断。

# 实测记录：媒体或网友亲测，带日期和出处。result: success 转到了 / slow 转到但很费劲 / fail 没转到
reports:
  - date: 2026-09-09
    channel: phone
    result: success
    by: 新京报（2026 年 9 月 4—6 日实测）
    url: https://news.qq.com/rain/a/20260909A04K8J00
    summary: 第一次要人工会被提示「智能客服可以解决」，再坚持说一次即可转接。
  - date: 2026-03-07
    channel: phone
    result: slow
    by: 凤凰WEEKLY财经（2026 年 3 月实测）
    url: https://finance.sina.com.cn/wm/2026-03-07/doc-inhqcipv5499286.shtml
