# 行业分类
# regulators: 该行业转人工失败、企业不处理时，可以去找的监管/投诉渠道（对应 regulators.yaml 的 id）
# generic_phone: 没有针对该企业的实测记录时，展示的通用电话转人工方法（写清是通用方法）

- id: telecom
  name: 通信运营商
  icon: 📶
  regulators: [miit]
  generic_phone:
    - 实名登记且满 65 周岁的用户，用本人号码拨打 10086 / 10010 / 10000 可一键进入人工（工信部 2020 年起推行的适老化措施）。
    - 其他用户：说「人工服务」，被劝阻就再说一次。
    - 听不到人工选项时，把菜单听完，人工常放在最后一项。

- id: bank
  name: 银行
  icon: 🏦
  regulators: [nfra]
  generic_phone:
    - 听到提示后直接说「人工服务」。
    - 被劝「智能客服也能办」时，再说一次「人工服务」。两家媒体 2026 年实测，多数银行说 2～3 次即可转接。
    - 如果不说话、不按键，部分银行会主动报出人工选项。
    - 老年客户可留意「老年客户专线」「说帮助」之类的提示。

- id: payment
  name: 支付
  icon: 💳
  regulators: [pbc]
  generic_phone:
    - 说「人工服务」，被劝阻就再说一次。
    - 如果被转到按键菜单，把菜单听完再选，人工选项常放在最后。
    - 涉及盗刷、资金被冻结等资金安全问题，要明确说出来：国标要求涉及财产安全的场景优先转人工。

- id: ecommerce
  name: 电商购物
  icon: 🛒
  regulators: [samr]
  generic_phone:
    - 先准备好订单号。说「人工服务」，被劝阻就再说一次。
    - 被转进按键菜单时，把菜单听完，人工常藏在「返回请按 *」「结束请挂机」之后，可以试按 0。
  generic_online:
    - 从订单详情页进入客服，而不是从首页，系统能直接带上订单信息。
    - 直接发送「转人工」或「人工客服」，并写明诉求关键词，如「退款」「投诉」。
    - 涉及价格、退款、赔偿的承诺，要求人工确认，并截图保存。

- id: local
  name: 外卖与本地生活
  icon: 🍜
  regulators: [samr]
  generic_phone:
    - 先准备好订单号。说「人工服务」，被劝阻就再说一次。
    - 被转进按键菜单时，把菜单听完，人工常放在最后，可以试按 0。
  generic_online:
    - 从订单详情页进入客服，直接发送「转人工」，并写明「退款」「投诉」等诉求。
    - 涉及价格、退款、赔偿的承诺，要求人工确认，并截图保存。

- id: travel
  name: 出行与旅行
  icon: 🧳
  regulators: [mot, local12345, samr]
  generic_phone:
    - 先准备好订单号、出行日期。说「人工服务」，被劝阻就再说一次。
    - 临近出发的紧急情况（误机、行程受阻）要明确说「紧急」「行程马上开始」。
    - 被转进按键菜单时，把菜单听完，人工常放在最后，可以试按 0。

- id: public
  name: 铁路与公共服务
  icon: 🚄
  regulators: [local12345]
  generic_phone:
    - 说「人工服务」，被劝阻就再说一次。
    - 准备好订单号、乘车日期和车次。

- id: airline
  name: 航空公司
  icon: ✈️
  regulators: [caac]
  generic_phone:
    - 准备好票号或订单号、航班号。说「人工服务」，被劝阻就再说一次。
    - 航班延误、取消等紧急情况，明确说出航班号和出发时间。

- id: express
  name: 快递物流
  icon: 📦
  regulators: [spb]
  generic_phone:
    - 准备好运单号。说「人工服务」或「投诉」，被劝阻就再说一次。
    - 被转进按键菜单时，把菜单听完，人工常放在最后。

- id: insurance
  name: 保险
  icon: 🛡️
  regulators: [nfra]
  generic_phone:
    - 说「转人工服务」，再按提示选择业务类型。新京报 2026 年 9 月实测 6 家保险机构，普遍两步即可接通人工。
    - 理赔、退保等问题准备好保单号。

- id: utility
  name: 水电燃气
  icon: 💡
  regulators: [nea, local12345]
  generic_phone:
    - 停电、漏电等涉及安全的问题，接通后第一句就说清楚「停电」「有安全隐患」和地址。
    - 其他问题说「人工服务」，被劝阻就再说一次。
